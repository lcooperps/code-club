<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Club</title>
<meta name="description" content="Code Club: make games, stories, art, AI and music with code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fcfdfd; --bg-alt: #f6f1fe; --ink: #1d1830; --muted: #625d78;
    --teal: #0d9488; --teal-dark: #0f766e; --purple: #7c3aed;
    --teal-tint: #e0f5f2; --purple-tint: #efe7fd; --line: #e7e3f0;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; }
  h1, h2, h3 { font-family: "Space Grotesk", Inter, sans-serif; line-height: 1.15; margin: 0 0 .5rem; }
  a { color: var(--teal-dark); }
  code { background: var(--purple-tint); padding: .1em .35em; border-radius: 5px; font-size: .9em; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem; }

  header.hero { background: linear-gradient(120deg, var(--teal) 0%, var(--purple) 100%); color: #fff; padding: 3.5rem 0 3rem; }
  .hero h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); }
  .hero p { font-size: 1.15rem; max-width: 36rem; opacity: .95; margin: 0 0 1.5rem; }
  .sessions { display: flex; flex-wrap: wrap; gap: .6rem; }
  .pill { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: .4rem .9rem; font-weight: 500; }
  .contact { margin-top: 1rem; font-size: .95rem; opacity: .9; }

  nav.jump { position: sticky; top: 0; z-index: 5; background: rgba(252,253,253,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  nav.jump .wrap { display: flex; gap: 1.25rem; padding-top: .7rem; padding-bottom: .7rem; overflow-x: auto; }
  nav.jump a { text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
  nav.jump a:hover { color: var(--purple); }

  section { padding: 3rem 0; }
  section.alt { background: var(--bg-alt); }
  .lead { color: var(--muted); max-width: 40rem; margin: 0 0 1.75rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; }
  @media (min-width: 900px) { #flavour-grid { grid-template-columns: repeat(var(--n, 5), 1fr); } }
  .tabs { display: inline-flex; gap: .35rem; background: var(--bg-alt); border: 1px solid var(--line); border-radius: 999px; padding: .3rem; margin: .25rem 0 1rem; }
  .tabs button { font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: .5rem 1.1rem; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: linear-gradient(120deg, var(--teal), var(--purple)); color: #fff; }
  .flavour { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; text-align: left; cursor: pointer; font: inherit; color: inherit; position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .flavour::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--c, var(--teal)); }
  .flavour:hover, .flavour:focus-visible { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(29,24,48,.08); border-color: var(--c, var(--purple)); outline: none; }
  .flavour .colour { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); margin: .1rem 0 .35rem; }
  .flavour .emoji { font-size: 2rem; display: block; margin: .4rem 0 .5rem; }
  .flavour h3 { font-size: 1.25rem; }
  .flavour p { margin: 0 0 .75rem; color: var(--muted); font-size: .95rem; }
  .flavour .tool { font-size: .8rem; font-weight: 600; color: var(--teal-dark); background: var(--teal-tint); border-radius: 999px; padding: .2rem .6rem; margin-top: auto; display: inline-block; }

  dialog { border: none; border-radius: 20px; padding: 0; max-width: 640px; width: calc(100% - 2rem); color: var(--ink); box-shadow: 0 30px 60px rgba(29,24,48,.25); }
  dialog::backdrop { background: rgba(29,24,48,.45); }
  .dlg-head { background: linear-gradient(rgba(29,24,48,.18), rgba(29,24,48,.18)), var(--c, #0d9488); color: #fff; padding: 1.5rem 1.5rem 1.25rem; position: relative; }
  .dlg-head p { margin: 0; opacity: .95; }
  .close { position: absolute; top: .8rem; right: .8rem; background: rgba(255,255,255,.2); color: #fff; border: 0; width: 2.2rem; height: 2.2rem; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
  .dlg-body { padding: 1.25rem 1.5rem 1.5rem; max-height: 65vh; overflow-y: auto; }
  .dlg-body h4 { font-family: "Space Grotesk", sans-serif; margin: 1.2rem 0 .4rem; color: var(--purple); font-size: 1.05rem; }
  .dlg-body ol, .dlg-body ul { padding-left: 1.3rem; margin: 0; }
  .dlg-body li { margin-bottom: .35rem; }
  .btn { display: inline-block; background: var(--teal); color: #fff; text-decoration: none; padding: .65rem 1.1rem; border-radius: 10px; font-weight: 600; margin-top: .25rem; }
  .btn:hover { background: var(--teal-dark); }
  .codebox { position: relative; }
  .codebox pre { background: #1d1830; color: #f6f1fe; border-radius: 10px; padding: 1rem; overflow-x: auto; font-size: .85rem; line-height: 1.45; margin: 0; }
  .codebox pre code { background: none; padding: 0; color: inherit; }
  .copy { position: absolute; top: .5rem; right: .5rem; font: inherit; font-size: .8rem; font-weight: 600; border: 0; border-radius: 6px; padding: .3rem .6rem; background: var(--teal); color: #fff; cursor: pointer; }
  .tip { background: var(--teal-tint); border-radius: 10px; padding: .75rem 1rem; margin-top: 1rem; font-size: .95rem; }

  .news { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
  .news li { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1.1rem; display: flex; gap: 1rem; }
  .news time { color: var(--purple); font-weight: 600; white-space: nowrap; font-size: .9rem; padding-top: .1rem; }

  .show { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; }
  .show h3 { font-size: 1.1rem; }
  .show .by { color: var(--muted); font-size: .9rem; margin: 0 0 .4rem; }
  .tag { font-size: .75rem; font-weight: 600; color: var(--purple); background: var(--purple-tint); border-radius: 999px; padding: .15rem .55rem; }
  .empty { color: var(--muted); background: #fff; border: 2px dashed var(--line); border-radius: var(--radius); padding: 1.5rem; text-align: center; }

  footer { padding: 2rem 0; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1 id="club-name">Code Club</h1>
    <p id="tagline"></p>
    <div class="sessions" id="sessions"></div>
    <p class="contact" id="contact"></p>
  </div>
</header>

<nav class="jump" aria-label="Sections">
  <div class="wrap">
    <a href="#flavours">Pick a flavour</a>
    <a href="#news">News</a>
    <a href="#challenges">Challenges</a>
    <a href="#showcase">Showcase</a>
  </div>
</nav>

<main>
  <section id="flavours">
    <div class="wrap">
      <h2>Pick a flavour</h2>
      <div class="tabs" role="tablist" id="level-tabs"></div>
      <p class="lead" id="flavour-lead"></p>
      <div class="grid" id="flavour-grid"></div>
    </div>
  </section>

  <section id="news" class="alt">
    <div class="wrap">
      <h2>News</h2>
      <ul class="news" id="news-list"></ul>
    </div>
  </section>

  <section id="challenges">
    <div class="wrap">
      <h2>Challenges</h2>
      <p class="lead">Optional extras for when you want something to aim at.</p>
      <div class="grid" id="challenge-grid"></div>
    </div>
  </section>

  <section id="showcase" class="alt">
    <div class="wrap">
      <h2>Showcase</h2>
      <p class="lead">Things Code Club members have made. Yours could be next.</p>
      <div class="grid" id="showcase-grid"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">Code Club · Prendergast School</div>
</footer>

<dialog id="flavour-dialog" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <button class="close" aria-label="Close">×</button>
    <h2 id="dlg-title"></h2>
    <p id="dlg-make"></p>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

<script src="content.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmtDate = (d) => {
    const dt = new Date(d + "T12:00:00");
    return isNaN(dt) ? esc(d) : dt.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  };

  // Hero
  $("club-name").textContent = CLUB.name;
  document.title = CLUB.name;
  $("tagline").textContent = CLUB.tagline;
  $("contact").textContent = CLUB.contact;
  $("sessions").innerHTML = CLUB.sessions
    .map((s) => `<span class="pill">${esc(s.day)} ${esc(s.time)} · ${esc(s.room)} · ${esc(s.who)}</span>`)
    .join("");

  // Flavours (steps and ideas may contain simple HTML such as <b> and <code>)
  const levels = CLUB.levels || [{ id: "all", label: "All", lead: "" }];
  let currentLevel = levels[0].id;
  function renderFlavours(levelId) {
    currentLevel = levelId;
    const level = levels.find((l) => l.id === levelId) || levels[0];
    $("flavour-lead").textContent = level.lead || "";
    document.querySelectorAll("#level-tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.level === levelId));
    const list = CLUB.flavours.filter((f) => !CLUB.levels || f.level === levelId);
    $("flavour-grid").style.setProperty("--n", list.length);
    $("flavour-grid").innerHTML = list.map((f) => `
    <button class="flavour" data-id="${esc(f.id)}" style="--c:${esc(f.colour || "#0d9488")}">
      <span class="emoji" aria-hidden="true">${f.emoji}</span>
      <h3>${esc(f.title)}</h3>
      ${f.colourName ? `<span class="colour">${esc(f.colourName)} cards</span>` : ""}
      <p>${esc(f.hook)}</p>
      <span class="tool">${esc(f.tool)}</span>
    </button>`).join("");
    document.querySelectorAll(".flavour").forEach((b) => b.addEventListener("click", () => openFlavour(b.dataset.id)));
  }
  $("level-tabs").innerHTML = CLUB.levels
    ? levels.map((l) => `<button role="tab" data-level="${esc(l.id)}">${esc(l.label)}</button>`).join("")
    : "";
  document.querySelectorAll("#level-tabs button").forEach((b) => b.addEventListener("click", () => {
    renderFlavours(b.dataset.level);
    history.replaceState(null, "", "#" + b.dataset.level);
  }));

  const dlg = $("flavour-dialog");
  function openFlavour(id) {
    const f = CLUB.flavours.find((x) => x.id === id);
    if (!f) return;
    $("dlg-title").textContent = `${f.emoji} ${f.title}`;
    dlg.style.setProperty("--c", f.colour || "");
    $("dlg-make").textContent = "You will make: " + f.make;
    $("dlg-body").innerHTML = `
      <a class="btn" href="${esc(f.link)}" target="_blank" rel="noopener">Open ${esc(f.tool)} ↗</a>
      <h4>Quick start</h4>
      <ol>${f.steps.map((s) => `<li>${s}</li>`).join("")}</ol>
      ${f.code ? `<h4>Starter code</h4><div class="codebox"><button class="copy" type="button">Copy</button><pre><code>${esc(f.code)}</code></pre></div>` : ""}
      <h4>Make it yours</h4>
      <ul>${f.ideas.map((s) => `<li>${s}</li>`).join("")}</ul>
      ${f.stuck ? `<div class="tip"><b>Stuck?</b> ${f.stuck}</div>` : ""}
      ${f.further ? `<div class="tip"><b>Go further:</b> ${f.further}</div>` : ""}`;
    const copyBtn = dlg.querySelector(".copy");
    if (copyBtn) copyBtn.addEventListener("click", () => {
      try { navigator.clipboard.writeText(f.code); copyBtn.textContent = "Copied!"; } catch (e) { copyBtn.textContent = "Select and copy"; }
    });
    dlg.showModal();
    history.replaceState(null, "", "#" + id);
  }
  dlg.querySelector(".close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", () => history.replaceState(null, "", "#" + currentLevel));
  // Link straight to a tab (yoursite/#ks45) or a flavour (yoursite/#games)
  const start = location.hash.slice(1);
  const startFlavour = CLUB.flavours.find((f) => f.id === start);
  if (startFlavour) { renderFlavours(startFlavour.level || levels[0].id); openFlavour(start); }
  else renderFlavours(levels.some((l) => l.id === start) ? start : levels[0].id);

  // News
  $("news-list").innerHTML = CLUB.news
    .map((n) => `<li><time>${fmtDate(n.date)}</time><span>${esc(n.text)}</span></li>`)
    .join("") || `<li>No news yet.</li>`;

  // Challenges
  $("challenge-grid").innerHTML = CLUB.challenges.length
    ? CLUB.challenges.map((c) => `
      <div class="show">
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.text)}</p>
        ${c.due ? `<span class="tag">Due ${fmtDate(c.due)}</span>` : ""}
      </div>`).join("")
    : `<div class="empty">No challenges right now.</div>`;

  // Showcase
  const flavourOf = (id) => CLUB.flavours.find((f) => f.id === id) || { title: id };
  $("showcase-grid").innerHTML = CLUB.showcase.length
    ? CLUB.showcase.map((s) => `
      <div class="show">
        ${s.flavour ? `<span class="tag" style="color:#fff;background:${esc(flavourOf(s.flavour).colour || "#7c3aed")}">${esc(flavourOf(s.flavour).title)}</span>` : ""}
        <h3 style="margin-top:.5rem">${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</h3>
        <p class="by">by ${esc(s.by)}</p>
        ${s.note ? `<p style="margin:0">${esc(s.note)}</p>` : ""}
      </div>`).join("")
    : `<div class="empty">Nothing here yet. Make something and show us!</div>`;
</script>
</body>
</html>
